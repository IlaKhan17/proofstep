# Runs Proofstep's own reference suite on its own changes.
#
# This doubles as the worked example: it is the workflow the documentation points
# at, so if it breaks, the instructions we hand new users are broken too.
#
# It runs on pushes to main as well as on pull requests, and that is not
# redundancy. This repository's history is almost entirely direct pushes to main,
# so a PR-only trigger meant this workflow had never executed once — and in that
# time it rotted exactly as you would expect: it referenced
# `./.github/actions/proofstep` while the directory was still named `evalforge`
# after an incomplete rename, so every run it never had would have failed with
# "action not found". A guard that cannot fire is not a guard.

name: Evals

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "evals/**"
      - "examples/**"
      - ".github/workflows/evals.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "evals/**"
      - "examples/**"
      - ".github/workflows/evals.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  # Required for the comment. Without it the run succeeds and the comment silently
  # does not appear, which is a confusing way to fail.
  pull-requests: write

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reply-intent:
    name: reply-intent suite
    runs-on: ubuntu-latest
    # A fork PR gets no secrets, so anything needing a provider key or a server
    # token cannot run here. This suite is deliberately offline and deterministic,
    # so it runs everywhere — see docs/SECURITY.md §12 for why running fork code
    # with real secrets is a supply-chain compromise rather than a convenience.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # baseline resolution needs history

      - uses: ./.github/actions/proofstep
        with:
          suite: evals/suites/reply-intent.yaml
          output: proofstep-report.json
