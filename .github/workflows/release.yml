name: release

# Publishes the five distributions to PyPI when a version tag is pushed.
#
# Trusted Publishing (OIDC), not an API token. A long-lived token in repository secrets is a
# credential that can publish a package forever and is readable by any workflow that gets modified;
# OIDC mints a short-lived one per run, scoped to this repository and this workflow file.
#
# One manual step before the first release: configure each project's trusted publisher on PyPI
# (Publishing → Add a pending publisher) with owner `IlaKhan17`, repository `proofstep`, workflow
# `release.yml`, and environment `pypi`. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate before anything is published. A version on PyPI cannot be reclaimed — the number is
  # spent even if the file is deleted — so nothing is uploaded until the tests that ran on this
  # exact commit are known to have passed.
  #
  # It *checks* CI rather than re-running it, and the difference matters. This job used to run
  # `pytest -q` itself, on one runner with one Postgres service. CI runs the same suites across
  # eleven jobs, each with the environment its suite needs: the acceptance test wants a live server
  # and a deliberately dead object-store endpoint, the row-level-security suite wants a second
  # database role. A single flat run reproduces none of that, so it failed on the first real release
  # for reasons that had nothing to do with the release — a worker heartbeat table in a database
  # that job never migrates, and an acceptance test with no acceptance environment.
  #
  # A gate that fails for reasons unrelated to what it is gating is a gate people learn to bypass.
  verify:
    name: CI must have passed on this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: the CI workflow succeeded for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # By commit SHA, not by branch or by "the latest run". A tag can point at any commit, and
          # "main is green" is not the same statement as "this artefact's source is green".
          run=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
            --jq '.workflow_runs[0] | {status, conclusion, html_url} | @json')
          echo "CI on ${GITHUB_SHA}: ${run}"
          status=$(echo "$run" | uv run --no-project python -c "import json,sys; print(json.load(sys.stdin).get('status') or 'none')" 2>/dev/null || echo none)
          conclusion=$(echo "$run" | uv run --no-project python -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')" 2>/dev/null || echo none)

          # Fails closed, and says which kind of "no" it is. These need different actions from
          # whoever pushed the tag, and a single "not success" would send them looking in the
          # wrong place.
          if [ "$status" = "none" ]; then
            echo "::error::No CI run found for ${GITHUB_SHA}. Push the commit to main first, " \
                 "then tag it — a tag alone does not run CI."
            exit 1
          fi
          if [ "$conclusion" = "none" ]; then
            echo "::error::CI on this commit is still ${status}. Wait for it, then re-push the tag."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish: CI on this commit concluded '${conclusion}'."
            exit 1
          fi

      - name: the tag matches the packaged version
        # A tag that disagrees with pyproject.toml publishes a version nobody can find from the
        # repository, and the mismatch is invisible until someone tries.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(uv run --no-project python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('packages/python-sdk/pyproject.toml').read_text())['project']['version'])
          ")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "tag $TAG does not match packaged version $PKG"; exit 1; }

      - name: every package agrees on that version
        # Five distributions released together. One left behind at an older version is a
        # dependency resolution nobody can reproduce, and it cannot be corrected in place.
        run: |
          uv run --no-project python - <<'PY'
          import pathlib, sys, tomllib
          versions = {}
          for manifest in sorted(pathlib.Path("packages").glob("*/pyproject.toml")):
              data = tomllib.loads(manifest.read_text())["project"]
              versions[data["name"]] = data["version"]
          if len(set(versions.values())) != 1:
              sys.exit(f"packages disagree on version: {versions}")
          print("all five at", next(iter(versions.values())))
          PY

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: build all five, each into its own directory
        # Separate directories because the publish step uploads a *directory*, and uploading them
        # together is what caused a partial release: see the note in the publish job.
        run: |
          set -euo pipefail
          uv build packages/shared-types      --out-dir dist/1-types
          uv build packages/evaluation-core   --out-dir dist/2-core
          uv build packages/trajectory-engine --out-dir dist/3-trajectory
          uv build packages/python-sdk        --out-dir dist/4-sdk
          uv build packages/cli               --out-dir dist/5-cli
          # `uv build` leaves a .gitignore in each output directory. The publish action uploads the
          # directory's contents, and twine refuses a file it does not recognise as a distribution,
          # so it has to go.
          find dist -name ".gitignore" -delete
          # Numbered in dependency order, so the directory listing is the publish order and a
          # reordering is visible in review rather than implied.
          find dist -type f | sort

      - name: each directory holds exactly one distribution
        # A stray file here uploads a package out of order, which is the failure this whole
        # arrangement exists to prevent — and an empty directory would publish nothing while
        # reporting success.
        run: |
          set -euo pipefail
          for dir in dist/*/; do
            wheels=$(find "$dir" -name "*.whl" | wc -l | tr -d " ")
            sdists=$(find "$dir" -name "*.tar.gz" | wc -l | tr -d " ")
            total=$(find "$dir" -type f | wc -l | tr -d " ")
            if [ "$wheels" != "1" ] || [ "$sdists" != "1" ] || [ "$total" != "2" ]; then
              echo "$dir: $wheels wheel(s), $sdists sdist(s), $total file(s) — expected exactly one of each"
              find "$dir" -type f
              exit 1
            fi
          done
          echo "five directories, one wheel and one sdist each"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  # Five jobs, not five steps, and chained rather than parallel.
  #
  # A trusted publisher can only be scoped per *job* — GitHub Actions has no per-step environment —
  # and a pending publisher's identity has to be unique per project while it is still pending. Five
  # packages sharing one environment name would collide on that uniqueness the moment more than one
  # of them was still unclaimed, which is exactly what happened registering these by hand: PyPI
  # refused a second pending publisher with the same (repo, workflow, environment) as one already
  # pending under a different project name, and separately caps an account at three pending
  # publishers at once — an anti-squatting limit, not a bug on either side.
  #
  # So each package gets its own GitHub environment (`pypi-types`, `pypi-core`, ...) and its own
  # job, and the five are chained with `needs` in the same leaves-first order the old single job
  # enforced with step ordering — the SDK depends on the other four, so it publishes only once they
  # are up, and nothing is ever live with a dependency missing from the registry.
  #
  # `skip-existing` stays on every one: a re-run after a partial failure — including a
  # not-yet-registered publisher for a later package — uploads what is missing and leaves the rest
  # alone.
  publish-types:
    name: publish proofstep-types
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-types
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist/1-types, skip-existing: true}

  publish-core:
    name: publish proofstep-core
    needs: publish-types
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist/2-core, skip-existing: true}

  publish-trajectory:
    name: publish proofstep-trajectory
    needs: publish-core
    runs-on: ubuntu-latest
    environment: pypi-trajectory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist/3-trajectory, skip-existing: true}

  publish-sdk:
    name: publish proofstep
    needs: publish-trajectory
    runs-on: ubuntu-latest
    # The one environment that predates the other four: `proofstep`'s pending publisher was
    # consumed when 0.1.0's wheel first went up, so this is now a normal trusted publisher tied to
    # an existing project rather than a pending one — no uniqueness constraint to collide with.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist/4-sdk, skip-existing: true}

  publish-cli:
    name: publish proofstep-cli
    needs: publish-sdk
    runs-on: ubuntu-latest
    environment: pypi-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist/5-cli, skip-existing: true}
