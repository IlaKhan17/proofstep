# Local development / self-hosting reference deployment (ADR-016).
#
# Every port binds to 127.0.0.1 only: this file must never accidentally expose a
# database to a network. Credentials come from .env, which `make setup` generates
# with random values — there are deliberately no default passwords here.
#
# Host ports are overridable. Developers commonly already have a Postgres on 5432
# from another project, and a compose file that cannot coexist with one is a
# compose file people stop using.

name: proofstep

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/gen-dev-env.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-dev-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-proofstep}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # chainguard/minio, not minio/minio: MinIO withdrew their community images from Docker Hub, and
    # `minio/minio` now 404s for everyone — which broke `docker compose up` for every self-hoster and
    # every CI run, silently, without a commit of ours touching it. This image is the same MinIO
    # server (same entrypoint, same `mc` for the health check below), rebuilt by Chainguard.
    #
    # Unpinned, reluctantly: the free tier publishes only `latest`, so there is no version tag to
    # pin, and a digest pin rots when Chainguard garbage-collects superseded digests. See
    # docs/DEPLOYING.md for pointing this at real object storage instead, which is what a production
    # deployment should do anyway.
    image: chainguard/minio:latest
    # As root, which the old minio/minio image also did. Chainguard's image defaults to uid 65532,
    # and that uid cannot read `secrets/s3_secret_key` (mode 600, owned by whoever ran
    # init_secrets.sh) or write to a fresh named volume. MinIO then reports
    # "Unable to validate credentials inherited from the secret file(s)", which reads like a wrong
    # password and is actually a permission error. macOS hides this: Docker Desktop's file sharing
    # makes the mount readable regardless, so it fails only on Linux — which is to say in CI and on
    # every real deployment.
    user: "0:0"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?run scripts/gen-dev-env.sh}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?run scripts/gen-dev-env.sh}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
  miniodata:
